# SBL core-loop E2E for Maestro (iOS simulator / Android emulator).
#
# This is the MOST FAITHFUL way to verify the full loop, including the two steps
# the web suite can't cover (set logging + ghost prefill), because it runs the real
# native app where TextInput.onEndEditing fires on blur.
#
# Prerequisites (see e2e/README.html for the full walkthrough):
#   1. A Java runtime (Maestro needs a JRE) and Maestro on PATH:
#        brew install --cask temurin        # or any JDK
#        curl -Ls https://get.maestro.mobile.dev | bash
#        export PATH="$PATH:$HOME/.maestro/bin"
#   2. A native dev build installed on a booted simulator (Expo Go is NOT reliable
#      here — Maestro launches by bundle id and Expo Go starts on its project list):
#        sudo gem install cocoapods          # one-time, needs admin
#        npx expo run:ios                    # builds + installs the dev client
#      The default bundle id for this project's prebuild is com.anonymous.sbl.
#
# Run:
#   maestro test e2e/flows/core-loop.yaml
#
# Override the app id if your build differs:
#   maestro test -e APP_ID=com.you.sbl e2e/flows/core-loop.yaml
appId: ${APP_ID:-com.anonymous.sbl}
---
# Fresh state so the run is deterministic.
- clearState
- launchApp

# 1) Library: add an exercise -> it appears in the list.
- tapOn: "Library"
- tapOn:
    id: "exercise-name-input"
- inputText: "Bench Press"
- tapOn:
    id: "add-exercise-btn"
- assertVisible:
    id: "exercise-row-Bench Press"

# 2) Train: start a session, pick the exercise, log 2 sets.
- tapOn: "Train"
- tapOn:
    id: "start-session-btn"
- tapOn:
    id: "pick-exercise-Bench Press"
# Set 1: 135 lb x 5
- tapOn:
    id: "set-0-weight"
- inputText: "135"
- hideKeyboard          # commits the field (fires onEndEditing)
- tapOn:
    id: "set-0-reps"
- inputText: "5"
- hideKeyboard
# Add a second set row and log it: 145 lb x 3
- tapOn: "+ Add set"
- tapOn:
    id: "set-1-weight"
- inputText: "145"
- hideKeyboard
- tapOn:
    id: "set-1-reps"
- inputText: "3"
- hideKeyboard

# 3) Second session, same exercise -> previous numbers appear as ghost
#    placeholders. The inputs are empty, so the prior values show as hint text.
- tapOn: "Train"
- tapOn:
    id: "start-session-btn"
- tapOn:
    id: "pick-exercise-Bench Press"
- assertVisible: "135"   # ghost weight from the previous session
- assertVisible: "5"     # ghost reps from the previous session

# 4) Fully relaunch the app -> logged data persists (offline SQLite).
- stopApp
- launchApp
- tapOn: "Library"
- assertVisible:
    id: "exercise-row-Bench Press"
# Ghosts still derive from the persisted prior session after a cold relaunch.
- tapOn: "Train"
- tapOn:
    id: "start-session-btn"
- tapOn:
    id: "pick-exercise-Bench Press"
- assertVisible: "135"
- assertVisible: "5"
