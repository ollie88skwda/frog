<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 471 471">
  <title>Frog</title>
  <!--
    Frog mark (docs/brand/frog-brand-identity.html). Hand-authored vector — the
    supplied raster is redrawn, never traced, so edges stay crisp at every size.

    Art space: the silhouette occupies x 1.5..574.5, y 0.5..357.5 (573 x 357, a
    1.6:1 mark), so every number below is stated in the mark's own coordinates.

    The canvas is NOT the whole mark — it is the icon cut. A 1.6:1 mark cannot
    fill a square, and centring it leaves top/bottom margins ~2.5x the sides, so
    the frog reads as floating in a mostly-empty tile. This viewBox is instead a
    471-unit square window on the head + body, bottom-anchored: the haunches,
    feet and ground bar are wider than it and bleed off the left and right edges,
    and the ground bar sits just above the bottom edge. scripts/gen-pwa-icons.ts
    derives that window from the mark's measured boxes and asserts this viewBox
    and the #pad translate still match it — run it after any edit and it will
    hand you the new ones. (Its maskable target uses a second, un-cropped window instead: nothing
    may bleed outside the inner-80% safe circle.) Keeping the viewBox origin at
    0 0 is what lets #ground stay a plain 100% x 100% rect.

    Palette is the brand's, not the supplied art's navy/green: grass #46A758 (the
    accent token in theme.css) on the lab-ink ground #101211, the same value the
    manifest already uses for background_color/theme_color. On that dark ground
    the line work has to invert too — it is sage #ECEEED, and the eye glints go
    dark — otherwise the outline, feet and ground bar vanish and the frog reads
    as a floating blob. Ground and line work move together; changing one alone
    breaks the mark. The matching constant is GROUND in scripts/gen-pwa-icons.ts.
  -->
  <style>
    /*
      16px treatment. At favicon size the 27-unit outline lands on ~0.6px and
      greys out, and the nostrils and eye glints turn to haze — the mark reads as
      a green blob with no face. Under 25px we therefore drop those two finest
      details and thicken every remaining stroke. (It used to scale up 1.17 as
      well, to spend the margin on the frog; the icon cut has already spent it,
      and the thicker strokes grow the silhouette on their own.)
      Browsers rasterise a favicon by rendering the SVG at the requested size, so
      this matches on the 16px and 20px requests only; 32px and up get the full
      mark. A renderer that ignores it falls back to the full mark, which is a
      soft favicon, not a broken one.
    */
    @media (max-width: 24px) {
      .frog { stroke-width: 40 }
      .feet { stroke-width: 36 }
      .mouth { stroke-width: 26 }
      .eye { r: 32px }
      .fine { display: none }
    }
  </style>
  <rect id="ground" width="100%" height="100%" fill="#101211" />
  <g id="pad" transform="translate(-52.5 97)">
    <g
      class="frog"
      fill="#46A758"
      stroke="#ECEEED"
      stroke-width="27"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <!-- Haunches, behind the body: the lobes that make it a sitting frog. -->
      <ellipse cx="62" cy="282" rx="33.5" ry="55" />
      <ellipse cx="514" cy="282" rx="33.5" ry="55" />
      <!--
        Body: one closed path of five tangent arcs — left flank (r 258.5), left
        eye hump (r 61), the valley between the humps (r 112), then the mirror.
        The bottom edge is a straight line at y 344 that the ground bar covers.
        It is #body because the icon cut is measured off it: the head + body is
        the silhouette and is the one part the cut may never crop.
      -->
      <path
        id="body"
        d="M104.8 344
           A258.5 258.5 0 0 1 135.4 82.3
           A61 61 0 0 1 228.5 23.4
           A112 112 0 0 0 347.5 23.4
           A61 61 0 0 1 440.6 82.3
           A258.5 258.5 0 0 1 471.2 344
           Z"
      />
      <!-- Front feet, then mouth, then the ground bar the frog sits on. -->
      <path class="feet" fill="none" stroke-width="25" d="M178 294v50M398 294v50" />
      <path class="mouth" fill="none" stroke-width="18" d="M183 164h210" />
      <path fill="none" d="M15 344h546" />
    </g>
    <g fill="#ECEEED">
      <circle class="eye" cx="196" cy="77" r="27" />
      <circle class="eye" cx="380" cy="77" r="27" />
      <circle class="fine" cx="264" cy="95.5" r="8" />
      <circle class="fine" cx="312" cy="95.5" r="8" />
    </g>
    <g class="fine" fill="#101211">
      <circle cx="185" cy="61.5" r="6" />
      <circle cx="369" cy="61.5" r="6" />
    </g>
  </g>
</svg>
